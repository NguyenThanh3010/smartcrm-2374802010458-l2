services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:?DB_NAME is required in .env}"
      POSTGRES_USER: "${DB_USER:?DB_USER is required in .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:?DB_NAME is required in .env}"
      DB_USER: "${DB_USER:?DB_USER is required in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required in .env}"
      AUTH_USERNAME: "${AUTH_USERNAME:?AUTH_USERNAME is required in .env}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:?AUTH_PASSWORD is required in .env}"
      AUTH_TOKEN_SECRET: "${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required in .env}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required in .env}"
      PHONE_LOOKUP_KEY: "${PHONE_LOOKUP_KEY:?PHONE_LOOKUP_KEY is required in .env}"
    command: ["sh", "-c", "node migrate.js && node bootstrapAdmin.js && node encryptCustomerData.js && node seed.js && node index.js"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  test-db:
    image: postgres:18.4-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: smartcrm_test
      POSTGRES_USER: "${DB_USER:?DB_USER is required in .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required in .env}"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: src/backend/Dockerfile.test
    environment:
      NODE_ENV: test
      DB_HOST: test-db
      DB_PORT: "5432"
      DB_NAME: smartcrm_test
      DB_USER: "${DB_USER:?DB_USER is required in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required in .env}"
      AUTH_USERNAME: "${AUTH_USERNAME:?AUTH_USERNAME is required in .env}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:?AUTH_PASSWORD is required in .env}"
      AUTH_TOKEN_SECRET: "${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required in .env}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required in .env}"
      PHONE_LOOKUP_KEY: "${PHONE_LOOKUP_KEY:?PHONE_LOOKUP_KEY is required in .env}"
    command: ["sh", "-c", "node migrate.js && node bootstrapAdmin.js && node encryptCustomerData.js && node seed.js && npm test"]
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_test_data: